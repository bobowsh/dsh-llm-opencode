# Example settings.yaml snippet for dsh-llm-opencode
#
# The plugin works OUT OF THE BOX with sane defaults — you do NOT need to
# copy anything into your profile's settings.yaml. This file only documents
# the available overrides for the rare cases where you want to change them.
# Changes take effect immediately without restart.

llm-opencode:
  baseURL: "https://opencode.ai/zen/v1"
  maxTokens: 128000
  defaultContextWindow: 1000000
  streamIdleTimeoutMs: 300000
  # Optional: set to false to disable the startup auto-sync of the free model
  # catalog (gateway /models membership + models.dev metadata). Default: true.
  # Only applies while the built-in default catalog is in use; a custom
  # `models:` list below is never overwritten by the sync.
  # autoSyncModels: true
  # Optional: override the built-in free model catalog
  # models:
  #   - id: deepseek-v4-flash-free
  #     name: DeepSeek V4 Flash Free
  #     description: "DeepSeek V4 Flash free model via OpenCode Zen"
  #     contextWindow: 200000
  #     maxTokens: 128000
